# ============================================================
#  docker-compose.test.yml -- disposable Postgres for the test suite.
#
#. Seperate test DB because the testing shouldn't be on the live database.
#
#  Usage:
#    docker compose -f docker-compose.test.yml up -d
#    pytest
#    docker compose -f docker-compose.test.yml down -v   # -v: also drop the data
# ============================================================
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: vorlesung
      POSTGRES_PASSWORD: geheim
      POSTGRES_DB: vorlesung
    ports:
      - "1905:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d/
    tmpfs:
      - /var/lib/postgresql/data
